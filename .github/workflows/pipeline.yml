name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3

    - name: Setup Node
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install
      working-directory: ./api-gateway
      run: npm install

    - name: Build Docker Image
      run: docker build -t loja-veloz/api-gateway ./api-gateway